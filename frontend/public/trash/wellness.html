<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness & Beauty Services - EZNet</title>
    <meta name="description" content="Discover premium spa and salon services near you with EZNet">
    <style>
        :root {
            --brand1: #5E17EB;     /* primary Elizian purple */
            --brand2: #24105F;     /* deep purple */
            --accent-gradient: linear-gradient(135deg,var(--brand1),var(--brand2));
            --bg: #F5F5F5;
            --muted: #666666;
            --success: #4CAF50;
            --card: #FFFFFF;
            --tier-ather: #B0BEC5;
            --tier-nova:  #64B5F6;
            --tier-luminar:#9575CD;
            --tier-valiant:#66BB6A;
            --tier-echelon:#FFD54F;
            --glass: rgba(255,255,255,0.85);
            
            /* Legacy variables for compatibility */
            --primary: var(--brand1);
            --primary-dark: var(--brand2);
            --secondary: var(--glass);
            --accent: var(--tier-echelon);
            --text: #222;
            --text-muted: var(--muted);
            --border: rgba(94, 23, 235, 0.1);
            --card-bg: var(--card);
            --error: #ef4444;
            --shadow: 0 12px 32px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-lg: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        /* Header */
        .header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--secondary);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        /* Category Filters */
        .category-filters {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }

        .filters-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            text-decoration: none;
            font-size: 0.875rem;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Services Grid */
        .services-section {
            padding: 3rem 0;
        }

        .services-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text);
        }

        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .service-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .service-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .service-content {
            padding: 1.5rem;
        }

        .service-category {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .service-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .service-description {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .service-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .service-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .service-duration {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .service-venue {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .book-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: var(--radius);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .book-btn:hover {
            background: var(--primary-dark);
        }

        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .search-bar {
                order: 3;
                flex: 1 1 100%;
                margin: 0;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="mockups/images/z.png" alt="EZNet Logo">
                <span class="logo-text">EZNet</span>
            </a>
            
            <div class="search-bar">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" class="search-input" placeholder="Search spa services, salons, treatments..." id="searchInput">
            </div>
            
            <div class="user-actions">
                <a href="#" class="btn btn-outline">Sign In</a>
                <a href="#" class="btn btn-primary">Book Now</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Wellness & Beauty</h1>
            <p>Find premium spa treatments, salon services, and wellness experiences near you</p>
        </div>
    </section>

    <!-- Category Filters -->
    <section class="category-filters">
        <div class="filters-content">
            <a href="#" class="filter-btn active" data-category="all">
                <span>🏠</span> All Services
            </a>
            <a href="#" class="filter-btn" data-category="spa-and-salon">
                <span>💅</span> Spa and Salon
            </a>
            <a href="#" class="filter-btn" data-category="massage">
                <span>💆‍♀️</span> Massage
            </a>
            <a href="#" class="filter-btn" data-category="facial">
                <span>✨</span> Facial Treatments
            </a>
            <a href="#" class="filter-btn" data-category="hair">
                <span>💇‍♀️</span> Hair Services
            </a>
            <a href="#" class="filter-btn" data-category="nails">
                <span>💅</span> Nail Services
            </a>
        </div>
    </section>

    <!-- Services Section -->
    <section class="services-section">
        <div class="services-content">
            <div class="section-header">
                <h2 class="section-title">Available Services</h2>
                <a href="#" class="view-all">View All</a>
            </div>
            
            <div class="services-grid" id="servicesGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading services...
                </div>
            </div>
        </div>
    </section>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:5001';
        let allServices = [];
        let filteredServices = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', async function() {
            await loadServices();
            setupEventListeners();
        });

        // Check if user is authenticated (optional for standalone use)
        function checkAuthentication() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            return token && userInfo;
        }

        // Load services from API
        async function loadServices() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/service-categories`);
                const categoriesResult = await response.json();
                
                if (categoriesResult.success) {
                    const spaCategory = categoriesResult.data.find(cat => cat.slug === 'spa-services');
                    const salonCategory = categoriesResult.data.find(cat => cat.slug === 'salon-services');
                    
                    if (spaCategory && salonCategory) {
                        // Load spa services
                        const spaResponse = await fetch(`${API_BASE}/api/v1/partners?category=spa`);
                        const spaResult = await spaResponse.json();
                        
                        // Load salon services
                        const salonResponse = await fetch(`${API_BASE}/api/v1/partners?category=salon`);
                        const salonResult = await salonResponse.json();
                        
                        // For now, we'll use the existing partner data and create service cards
                        // In a real implementation, you'd fetch actual service data
                        allServices = [
                            {
                                id: 1,
                                name: 'Swedish Massage',
                                category: 'Spa and Salon',
                                categorySlug: 'spa',
                                description: 'Classic relaxation massage with long, flowing strokes to relieve muscle tension and promote deep relaxation',
                                price: 2500,
                                duration: '60 min',
                                venue: 'The Owlet Spa & Wellness Center',
                                organizer: 'The Owlet Wellness',
                                icon: '💆‍♀️',
                                image: null
                            },
                            {
                                id: 2,
                                name: 'Deep Tissue Massage',
                                category: 'Spa and Salon',
                                categorySlug: 'spa',
                                description: 'Intensive massage targeting deeper layers of muscle and connective tissue to relieve chronic tension',
                                price: 3000,
                                duration: '90 min',
                                venue: 'The Owlet Spa & Wellness Center',
                                organizer: 'The Owlet Wellness',
                                icon: '💆‍♀️',
                                image: null
                            },
                            {
                                id: 3,
                                name: 'Anti-Aging Facial',
                                category: 'Spa and Salon',
                                categorySlug: 'facial',
                                description: 'Advanced facial treatment with collagen-boosting ingredients to reduce fine lines and restore youthful glow',
                                price: 2200,
                                duration: '90 min',
                                venue: 'The Owlet Spa & Wellness Center',
                                organizer: 'The Owlet Wellness',
                                icon: '✨',
                                image: null
                            },
                            {
                                id: 4,
                                name: 'Premium Hair Cut & Style',
                                category: 'Spa and Salon',
                                categorySlug: 'salon',
                                description: 'Professional haircut with expert styling using premium products and techniques',
                                price: 1800,
                                duration: '60 min',
                                venue: 'The Owlet Salon',
                                organizer: 'The Owlet Beauty',
                                icon: '💇‍♀️',
                                image: null
                            },
                            {
                                id: 5,
                                name: 'Hair Color & Highlights',
                                category: 'Spa and Salon',
                                categorySlug: 'hair',
                                description: 'Professional hair coloring with custom highlights for a fresh, vibrant look',
                                price: 3500,
                                duration: '120 min',
                                venue: 'The Owlet Salon',
                                organizer: 'The Owlet Beauty',
                                icon: '💇‍♀️',
                                image: null
                            },
                            {
                                id: 6,
                                name: 'Gel Manicure',
                                category: 'Spa and Salon',
                                categorySlug: 'nails',
                                description: 'Long-lasting gel manicure with nail art options for beautiful, chip-free nails',
                                price: 1200,
                                duration: '45 min',
                                venue: 'The Owlet Salon',
                                organizer: 'The Owlet Beauty',
                                icon: '💅',
                                image: null
                            }
                        ];
                        
                        filteredServices = [...allServices];
                        renderServices();
                    }
                }
            } catch (error) {
                console.error('Error loading services:', error);
                showError('Failed to load services. Please try again.');
            }
        }

        // Render services in the grid
        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            
            if (filteredServices.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No services found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filteredServices.map(service => `
                <div class="service-card" onclick="bookService(${service.id})">
                    <div class="service-image">
                        <span style="font-size: 3rem;">${service.icon}</span>
                    </div>
                    <div class="service-content">
                        <div class="service-category">${service.category}</div>
                        <h3 class="service-name">${service.name}</h3>
                        <p class="service-description">${service.description}</p>
                        <div class="service-details">
                            <span class="service-price">₹${service.price}</span>
                            <span class="service-duration">⏱️ ${service.duration}</span>
                        </div>
                        <div class="service-venue">📍 ${service.venue}</div>
                        <button class="book-btn">Book Now</button>
                    </div>
                </div>
            `).join('');
        }

        // Setup event listeners
        function setupEventListeners() {
            // Category filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // Update active state
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Filter services
                    const category = this.dataset.category;
                    filterServices(category);
                });
            });
            
            // Search input
            document.getElementById('searchInput').addEventListener('input', function() {
                const query = this.value.toLowerCase();
                filterServices('all', query);
            });
        }

        // Filter services by category and search query
        function filterServices(category, searchQuery = '') {
            filteredServices = allServices.filter(service => {
                const matchesCategory = category === 'all' || service.categorySlug === category;
                const matchesSearch = !searchQuery || 
                    service.name.toLowerCase().includes(searchQuery) ||
                    service.description.toLowerCase().includes(searchQuery) ||
                    service.category.toLowerCase().includes(searchQuery);
                
                return matchesCategory && matchesSearch;
            });
            
            renderServices();
        }

        // Book service function
        function bookService(serviceId) {
            const service = allServices.find(s => s.id === serviceId);
            if (service) {
                alert(`Booking ${service.name} for ₹${service.price}`);
                // In a real implementation, this would open a booking modal or redirect to booking page
            }
        }

        // Show error message
        function showError(message) {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
