<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Wellness - EZNet</title>
    <meta name="description" content="Book appointments with doctors, track your health, and manage medical records">
    <style>
        :root {
            --brand1: #5E17EB;     /* primary Elizian purple */
            --brand2: #24105F;     /* deep purple */
            --accent-gradient: linear-gradient(135deg,var(--brand1),var(--brand2));
            --bg: #F5F5F5;
            --muted: #666666;
            --success: #4CAF50;
            --card: #FFFFFF;
            --tier-ather: #B0BEC5;
            --tier-nova:  #64B5F6;
            --tier-luminar:#9575CD;
            --tier-valiant:#66BB6A;
            --tier-echelon:#FFD54F;
            --glass: rgba(255,255,255,0.85);
            
            /* Legacy variables for compatibility */
            --primary: var(--brand1);
            --primary-dark: var(--brand2);
            --secondary: var(--glass);
            --accent: var(--tier-echelon);
            --text: #222;
            --text-muted: var(--muted);
            --border: rgba(94, 23, 235, 0.1);
            --card-bg: var(--card);
            --error: #ef4444;
            --warning: var(--tier-echelon);
            --shadow: 0 12px 32px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-lg: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        /* Header */
        .header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 3rem 0;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .search-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-tab {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .search-tab.active {
            background: white;
            color: var(--primary);
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            background: white;
        }

        .search-input:focus {
            outline: none;
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        /* Specializations Grid */
        .specializations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .specialization-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .specialization-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .specialization-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .specialization-name {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .specialization-count {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Doctors Grid */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .doctor-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .doctor-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .doctor-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .doctor-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            font-weight: 700;
        }

        .doctor-info {
            flex: 1;
        }

        .doctor-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .doctor-specialization {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .doctor-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .stars {
            color: #fbbf24;
        }

        .rating-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .doctor-details {
            margin-bottom: 1rem;
        }

        .doctor-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .doctor-fee {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .book-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .book-btn:hover {
            background: var(--primary-dark);
        }

        /* Appointment Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .time-slot {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .time-slot:hover {
            border-color: var(--primary);
            background: var(--secondary);
        }

        .time-slot.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .time-slot.unavailable {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .search-tabs {
                flex-direction: column;
            }

            .specializations-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .doctors-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .time-slots {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="mockups/images/z.png" alt="EZNet Logo">
                <span class="logo-text">EZNet Health</span>
            </a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="#doctors">Find Doctors</li>
                    <li><a href="#appointments">My Appointments</li>
                    <li><a href="#records">Health Records</li>
                    <li><a href="#pharmacy">Pharmacy</li>
                </ul>
            </nav>
            
            <div class="user-info">
                <a href="#" class="btn btn-primary">Login</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Your Health, Our Priority</h1>
            <p>Find the best doctors, book appointments, and manage your health records all in one place</p>
            
            <div class="search-container">
                <div class="search-tabs">
                    <button class="search-tab active" data-type="doctor">Find Doctors</button>
                    <button class="search-tab" data-type="specialization">By Specialization</button>
                    <button class="search-tab" data-type="location">By Location</button>
                </div>
                <input type="text" class="search-input" placeholder="Search for doctors, specializations, or symptoms..." id="searchInput">
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Specializations Section -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Popular Specializations</h2>
                <a href="#" class="view-all">View All</a>
            </div>
            
            <div class="specializations-grid" id="specializationsGrid">
                <!-- Specializations will be loaded dynamically -->
            </div>
        </section>

        <!-- Doctors Section -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Top Rated Doctors</h2>
                <a href="#" class="view-all">View All</a>
            </div>
            
            <div class="doctors-grid" id="doctorsGrid">
                <!-- Doctors will be loaded dynamically -->
            </div>
        </section>
    </div>

    <!-- Appointment Modal -->
    <div class="modal" id="appointmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Book Appointment</h3>
                <button class="close-btn" onclick="closeAppointmentModal()">&times;</button>
            </div>
            
            <form id="appointmentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="patientName">Patient Name</label>
                        <input type="text" id="patientName" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="patientAge">Age</label>
                        <input type="number" id="patientAge" class="form-input" min="1" max="120" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="patientPhone">Phone</label>
                        <input type="tel" id="patientPhone" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="patientEmail">Email</label>
                        <input type="email" id="patientEmail" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="appointmentDate">Preferred Date</label>
                        <input type="date" id="appointmentDate" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="appointmentType">Appointment Type</label>
                        <select id="appointmentType" class="form-input" required>
                            <option value="consultation">Consultation</option>
                            <option value="follow-up">Follow-up</option>
                            <option value="checkup">General Checkup</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">Available Time Slots</label>
                        <div class="time-slots" id="timeSlots">
                            <!-- Time slots will be loaded dynamically -->
                        </div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label" for="symptoms">Symptoms/Reason for Visit</label>
                        <textarea id="symptoms" class="form-input" rows="3" placeholder="Describe your symptoms or reason for the appointment..."></textarea>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Book Appointment</button>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:5001';
        let selectedDoctor = null;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', async function() {
            await loadSpecializations();
            await loadDoctors();
            setupEventListeners();
        });

        // Check if user is authenticated (optional for standalone use)
        function checkAuthentication() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            return token && userInfo;
        }

        // Load specializations
        async function loadSpecializations() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/service-subcategories?category_id=health-wellness`);
                const result = await response.json();
                
                if (result.success) {
                    renderSpecializations(result.data);
                } else {
                    loadMockSpecializations();
                }
            } catch (error) {
                console.error('Error loading specializations:', error);
                loadMockSpecializations();
            }
        }

        // Load mock specializations
        function loadMockSpecializations() {
            const specializations = [
                { name: 'Cardiology', icon: '❤️', count: 45 },
                { name: 'Dermatology', icon: '🧴', count: 32 },
                { name: 'Pediatrics', icon: '👶', count: 28 },
                { name: 'Orthopedics', icon: '🦴', count: 41 },
                { name: 'Gynecology', icon: '👩‍⚕️', count: 23 },
                { name: 'Neurology', icon: '🧠', count: 19 },
                { name: 'Ophthalmology', icon: '👁️', count: 27 },
                { name: 'Psychiatry', icon: '🧘', count: 15 }
            ];
            renderSpecializations(specializations);
        }

        // Load doctors
        async function loadDoctors() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/professionals?specialization=health`);
                const result = await response.json();
                
                if (result.success) {
                    renderDoctors(result.data);
                } else {
                    loadMockDoctors();
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
                loadMockDoctors();
            }
        }

        // Load mock doctors
        function loadMockDoctors() {
            const doctors = [
                {
                    id: 1,
                    first_name: 'Dr. Priya',
                    last_name: 'Sharma',
                    specialization: 'Cardiologist',
                    experience_years: 12,
                    rating: 4.8,
                    total_reviews: 156,
                    consultation_fee: 800,
                    partner_name: 'Apollo Hospital',
                    qualifications: 'MBBS, MD (Cardiology)'
                },
                {
                    id: 2,
                    first_name: 'Dr. Rajesh',
                    last_name: 'Kumar',
                    specialization: 'Dermatologist',
                    experience_years: 8,
                    rating: 4.6,
                    total_reviews: 89,
                    consultation_fee: 600,
                    partner_name: 'Fortis Healthcare',
                    qualifications: 'MBBS, MD (Dermatology)'
                },
                {
                    id: 3,
                    first_name: 'Dr. Sneha',
                    last_name: 'Patel',
                    specialization: 'Pediatrician',
                    experience_years: 10,
                    rating: 4.7,
                    total_reviews: 124,
                    consultation_fee: 500,
                    partner_name: 'Max Hospital',
                    qualifications: 'MBBS, MD (Pediatrics)'
                }
            ];
            renderDoctors(doctors);
        }

        // Render specializations
        function renderSpecializations(specializations) {
            const grid = document.getElementById('specializationsGrid');
            grid.innerHTML = specializations.map(spec => `
                <div class="specialization-card" onclick="searchBySpecialization('${spec.name}')">
                    <div class="specialization-icon">${spec.icon}</div>
                    <div class="specialization-name">${spec.name}</div>
                    <div class="specialization-count">${spec.count} doctors</div>
                </div>
            `).join('');
        }

        // Render doctors
        function renderDoctors(doctors) {
            const grid = document.getElementById('doctorsGrid');
            grid.innerHTML = doctors.map(doctor => `
                <div class="doctor-card">
                    <div class="doctor-header">
                        <div class="doctor-avatar">
                            ${doctor.first_name[0]}${doctor.last_name[0]}
                        </div>
                        <div class="doctor-info">
                            <div class="doctor-name">${doctor.first_name} ${doctor.last_name}</div>
                            <div class="doctor-specialization">${doctor.specialization}</div>
                            <div class="doctor-rating">
                                <span class="stars">★★★★★</span>
                                <span class="rating-text">${doctor.rating} (${doctor.total_reviews} reviews)</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="doctor-details">
                        <div class="doctor-detail">
                            <span>🏥</span>
                            <span>${doctor.partner_name}</span>
                        </div>
                        <div class="doctor-detail">
                            <span>🎓</span>
                            <span>${doctor.qualifications}</span>
                        </div>
                        <div class="doctor-detail">
                            <span>⏱️</span>
                            <span>${doctor.experience_years} years experience</span>
                        </div>
                    </div>
                    
                    <div class="doctor-fee">₹${doctor.consultation_fee}</div>
                    
                    <button class="book-btn" onclick="openAppointmentModal(${JSON.stringify(doctor).replace(/"/g, '&quot;')})">
                        Book Appointment
                    </button>
                </div>
            `).join('');
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                // Implement search logic here
            });

            // Search tabs
            document.querySelectorAll('.search-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Appointment form submission
            document.getElementById('appointmentForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitAppointment();
            });

            // Date change handler
            document.getElementById('appointmentDate').addEventListener('change', function() {
                loadTimeSlots(this.value);
            });

            // Close modal on outside click
            document.getElementById('appointmentModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeAppointmentModal();
                }
            });

            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('appointmentDate').min = today;
        }

        // Search by specialization
        function searchBySpecialization(specialization) {
            document.getElementById('searchInput').value = specialization;
            // Implement specialization-based search
        }

        // Open appointment modal
        function openAppointmentModal(doctor) {
            selectedDoctor = doctor;
            document.getElementById('appointmentModal').classList.add('show');
        }

        // Close appointment modal
        function closeAppointmentModal() {
            document.getElementById('appointmentModal').classList.remove('show');
            selectedDoctor = null;
            document.getElementById('appointmentForm').reset();
        }

        // Load time slots
        async function loadTimeSlots(date) {
            if (!selectedDoctor || !date) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/professionals/${selectedDoctor.id}/availability?date=${date}`);
                const result = await response.json();
                
                if (result.success) {
                    renderTimeSlots(result.data);
                }
            } catch (error) {
                console.error('Error loading time slots:', error);
                // Use mock time slots
                const mockSlots = [
                    { start_time: '09:00', end_time: '10:00', is_available: true },
                    { start_time: '10:00', end_time: '11:00', is_available: true },
                    { start_time: '11:00', end_time: '12:00', is_available: false },
                    { start_time: '14:00', end_time: '15:00', is_available: true },
                    { start_time: '15:00', end_time: '16:00', is_available: true },
                    { start_time: '16:00', end_time: '17:00', is_available: true },
                    { start_time: '17:00', end_time: '18:00', is_available: false }
                ];
                renderTimeSlots(mockSlots);
            }
        }

        // Render time slots
        function renderTimeSlots(slots) {
            const container = document.getElementById('timeSlots');
            container.innerHTML = slots.map(slot => `
                <div class="time-slot ${!slot.is_available ? 'unavailable' : ''}" 
                     onclick="${slot.is_available ? 'selectTimeSlot(this)' : ''}"
                     data-time="${slot.start_time}">
                    ${slot.start_time}
                </div>
            `).join('');
        }

        // Select time slot
        function selectTimeSlot(element) {
            // Remove previous selection
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            
            // Add selection to clicked slot
            element.classList.add('selected');
        }

        // Submit appointment
        async function submitAppointment() {
            if (!selectedDoctor) return;
            
            const selectedSlot = document.querySelector('.time-slot.selected');
            if (!selectedSlot) {
                alert('Please select a time slot');
                return;
            }
            
            const formData = {
                professional_id: selectedDoctor.id,
                service_id: null, // You can link to a specific service if needed
                appointment_date: document.getElementById('appointmentDate').value,
                start_time: selectedSlot.dataset.time,
                end_time: selectedSlot.dataset.time.split(':')[0] + ':59:59', // Approximate end time
                notes: document.getElementById('symptoms').value,
                total_amount: selectedDoctor.consultation_fee
            };
            
            try {
                const token = localStorage.getItem('token');
                const headers = { 'Content-Type': 'application/json' };
                
                // Add authorization header if user is authenticated
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch(`${API_BASE}/api/v1/appointments`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`Appointment booked successfully!\n\nDoctor: ${selectedDoctor.first_name} ${selectedDoctor.last_name}\nDate: ${formData.appointment_date}\nTime: ${selectedSlot.dataset.time}\nFee: ₹${selectedDoctor.consultation_fee}`);
                    
                    closeAppointmentModal();
                } else {
                    alert('Failed to book appointment: ' + result.error);
                }
            } catch (error) {
                console.error('Error booking appointment:', error);
                alert('Error booking appointment. Please try again.');
            }
        }
    </script>
</body>
</html>
