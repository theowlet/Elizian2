<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZNet Partner Login</title>
    <meta name="description" content="Login to EZNet Partner Console">
    <meta name="theme-color" content="#1f2937">
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--card);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: transparent;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .login-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: var(--secondary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
        }

        .demo-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .demo-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            text-align: center;
        }

        .demo-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .demo-btn {
            padding: 0.5rem;
            font-size: 0.875rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.error {
            background: var(--error);
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .forgot-password-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-password-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-close:hover {
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .otp-input {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5rem;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
            margin: 0 0.5rem;
            transition: background 0.2s;
        }

        .step-dot.active {
            background: var(--primary);
        }

        .step-dot.completed {
            background: var(--success);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <img src="mockups/images/z.png" alt="Z Logo" style="width: 32px; height: 32px; object-fit: contain;">
            </div>
            <div class="logo-text">EZNet</div>
        </div>
        
        <h1 class="login-title">Partner Login</h1>
        <p class="login-subtitle">Access your event venue dashboard</p>

        <form id="loginForm" autocomplete="on" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="your@venue.com" required autocomplete="username" inputmode="email" aria-required="true">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" aria-required="true">
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="loginText">Sign In</span>
                <div class="loading" id="loginLoading" style="display: none;"></div>
            </button>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="#" class="forgot-password-link" onclick="showForgotPasswordModal(); return false;">
                    Forgot your password?
                </a>
            </div>
        </form>

        <div class="register-link">
            Don't have an account? <a href="#" onclick="showRegisterForm()">Register your venue here</a>
        </div>

    </div>

    <!-- Register Modal -->
    <div id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: var(--card); border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text);">Register New Event Venue</h2>
                <button onclick="hideRegisterForm()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regName">Venue Name</label>
                    <input type="text" id="regName" class="form-input" placeholder="Your Venue Name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="your@venue.com" required autocomplete="email" inputmode="email" aria-required="true">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-input" placeholder="Choose a password (min 6 characters)" required minlength="6" autocomplete="new-password" aria-required="true">
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Password must be at least 6 characters long</small>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regCategory">Category</label>
                    <select id="regCategory" class="form-input" required>
                        <option value="">Select Category</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regAddress">Address</label>
                    <input type="text" id="regAddress" class="form-input" placeholder="Venue Address" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" class="form-input" placeholder="+91-9876543210" required autocomplete="tel" inputmode="tel" aria-required="true" pattern="^[+0-9\-()\s]{7,20}$">
                </div>
                
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span id="registerText">Register</span>
                    <div class="loading" id="registerLoading" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Password Recovery Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Password</h2>
                <button class="modal-close" onclick="hideForgotPasswordModal()">&times;</button>
            </div>
            
            <form id="forgotPasswordForm">
                <!-- Step Indicator -->
                <div class="step-indicator">
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                </div>

                <!-- Step 1: Enter Email -->
                <div id="step1" class="step active">
                    <div class="form-group">
                        <label class="form-label" for="recoveryEmail">Enter your email address</label>
                        <input type="email" id="recoveryEmail" class="form-input" placeholder="your@email.com" required autocomplete="email" inputmode="email">
                    </div>
                    <button type="button" class="btn btn-primary" id="sendCodeBtn" onclick="sendRecoveryCode()">
                        <span id="sendCodeText">Send Recovery Code</span>
                        <span id="sendCodeLoading" class="loading" style="display: none;"></span>
                    </button>
                </div>

                <!-- Step 2: Enter OTP and New Password -->
                <div id="step2" class="step">
                    <div class="form-group">
                        <label class="form-label" for="resetEmail">Email</label>
                        <input type="email" id="resetEmail" class="form-input" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="resetOtp">Enter the 6-digit code sent to your email</label>
                        <input type="text" id="resetOtp" class="form-input otp-input" placeholder="123456" maxlength="6" required inputmode="numeric" pattern="^[0-9]{6}$" aria-required="true">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" required autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" required autocomplete="new-password" minlength="6">
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-secondary" id="resendCodeBtn" onclick="resendCode()">
                            <span id="resendCodeText">Resend Code</span>
                            <span id="resendCodeLoading" class="loading" style="display: none;"></span>
                        </button>
                        <button type="button" class="btn btn-primary" id="resetPasswordBtn" onclick="resetPassword()">
                            <span id="resetPasswordText">Reset Password</span>
                            <span id="resetPasswordLoading" class="loading" style="display: none;"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script> 
        const API_BASE =  'http://localhost:3000';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadCategories();
        });

        // Load categories for registration
        async function loadCategories() {
            try {
                console.log('Loading categories...');
                const response = await fetch(`${API_BASE}/api/v1/categories`);
                console.log('Categories response status:', response.status);
                
                const result = await response.json();
                console.log('Categories API result:', result);
                
                if (result.success) {
                    const categorySelect = document.getElementById('regCategory');
                    console.log('Category select element:', categorySelect);
                    
                    if (!categorySelect) {
                        console.error('Category select element not found!');
                        return;
                    }
                    
                    categorySelect.innerHTML = '<option value="">Select Category</option>';
                    
                    result.data.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.id;
                        option.textContent = category.name;
                        categorySelect.appendChild(option);
                    });
                    
                    console.log('Categories loaded successfully:', result.data.length);
                } else {
                    console.error('Categories API error:', result.error);
                }
            } catch (error) {
                console.error('Error loading categories:', error);
                console.log('Make sure you are accessing the page via http://localhost:8080/partner-login.html');
                console.log('Make sure backend is running on http://localhost:5001');
            }
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            console.log('Form submit event triggered');
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Calling performLogin with:', email, password);
            await performLogin(email, password);
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                category_id: document.getElementById('regCategory').value,
                address: document.getElementById('regAddress').value,
                phone_number: document.getElementById('regPhone').value
            };
            
            console.log('Register form submitted with data:', formData);
            await performRegistration(formData);
        });

        // Perform login
        async function performLogin(email, password) {
            console.log('performLogin function called with:', email, password);
            console.log('API_BASE:', API_BASE);
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginLoading = document.getElementById('loginLoading');
            
            try {
                // Show loading state
                loginBtn.disabled = true;
                loginText.style.display = 'none';
                loginLoading.style.display = 'inline-block';
                
                console.log('Making login request to:', `${API_BASE}/api/v1/partners/auth/login`);
                const response = await fetch(`${API_BASE}/api/v1/partners/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Login response status:', response.status);
                const result = await response.json();
                console.log('Login response data:', result);
                
                if (result.success && result.data?.token) {
                    // Store token and partner info
                    localStorage.setItem('partnerToken', result.data.token);
                    localStorage.setItem('partnerInfo', JSON.stringify(result.data.partner));
                    
                    console.log('Login successful, redirecting to:', `partner-console.html?partner_id=${result.data.partner.id}`);
                    showNotification('Login successful! Redirecting...', 'success');
                    
                    // Redirect to partner console
                    setTimeout(() => {
                        console.log('About to redirect...');
                        window.location.href = `partner-console.html?partner_id=${result.data.partner.id}`;
                    }, 1000);
                } else if (response.status === 403 || (result.error && result.error.toLowerCase().includes('pending'))) {
                    showNotification(result.error || 'Your account is pending approval by the Super Admin.', 'warning');
                } else {
                    showNotification(result.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                console.error('Error details:', error.message);
                if (error.message.includes('Failed to fetch')) {
                    showNotification('Connection error. Please make sure you are accessing via http://localhost:8080 and the backend is running.', 'error');
                } else {
                    showNotification('Connection error: ' + error.message, 'error');
                }
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
            }
        }

        // Perform registration
        async function performRegistration(formData) {
            const registerBtn = document.getElementById('registerBtn');
            const registerText = document.getElementById('registerText');
            const registerLoading = document.getElementById('registerLoading');
            
            try {
                console.log('Registration form data:', formData);
                
                // Show loading state
                registerBtn.disabled = true;
                registerText.style.display = 'none';
                registerLoading.style.display = 'inline-block';
                
                const response = await fetch(`${API_BASE}/api/v1/partners/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success && result.data?.pendingApproval) {
                    showNotification('Registration submitted! We will review your application and activate your account shortly.', 'info');
                    document.getElementById('registerForm').reset();
                    hideRegisterForm();
                } else if (result.success && result.data?.token) {
                    // Legacy fallback if auto-approval is re-enabled
                    localStorage.setItem('partnerToken', result.data.token);
                    localStorage.setItem('partnerInfo', JSON.stringify(result.data.partner));
                    
                    showNotification('Registration successful! Redirecting to your console...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = `partner-console.html?partner_id=${result.data.partner.id}`;
                    }, 1500);
                } else {
                    showNotification(result.error || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showNotification('Connection error. Please try again.', 'error');
            } finally {
                // Reset button state
                registerBtn.disabled = false;
                registerText.style.display = 'inline';
                registerLoading.style.display = 'none';
            }
        }



        // Show register form
        function showRegisterForm() {
            document.getElementById('registerModal').style.display = 'flex';
        }

        // Hide register form
        function hideRegisterForm() {
            document.getElementById('registerModal').style.display = 'none';
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Show notification
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            // Remove notification after 3 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Password Recovery Functions
        function showForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.add('show');
            showStep(1);
        }

        function hideForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.remove('show');
            // Reset form
            document.getElementById('forgotPasswordForm').reset();
            showStep(1);
        }

        function showStep(stepNumber) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });

            // Show selected step
            document.getElementById(`step${stepNumber}`).classList.add('active');

            // Update step indicators
            document.querySelectorAll('.step-dot').forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                if (index + 1 < stepNumber) {
                    dot.classList.add('completed');
                } else if (index + 1 === stepNumber) {
                    dot.classList.add('active');
                }
            });
        }

        async function sendRecoveryCode() {
            const email = document.getElementById('recoveryEmail').value;
            const sendBtn = document.getElementById('sendCodeBtn');
            const sendText = document.getElementById('sendCodeText');
            const sendLoading = document.getElementById('sendCodeLoading');

            if (!email) {
                showNotification('Please enter your email address', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendText.style.display = 'none';
            sendLoading.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_BASE}/api/v1/partners/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('Recovery code sent to your email', 'success');
                    showStep(2);
                    // Store email for next step
                    document.getElementById('resetEmail').value = email;
                } else {
                    showNotification(result.error || 'Failed to send recovery code', 'error');
                }
            } catch (error) {
                console.error('Send recovery code error:', error);
                showNotification('Connection error. Please try again.', 'error');
            } finally {
                sendBtn.disabled = false;
                sendText.style.display = 'inline';
                sendLoading.style.display = 'none';
            }
        }

        async function resetPassword() {
            const email = document.getElementById('resetEmail').value;
            const otp = document.getElementById('resetOtp').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetPasswordBtn');
            const resetText = document.getElementById('resetPasswordText');
            const resetLoading = document.getElementById('resetPasswordLoading');

            if (!email || !otp || !newPassword || !confirmPassword) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showNotification('Password must be at least 6 characters long', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetText.style.display = 'none';
            resetLoading.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_BASE}/api/v1/partners/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('Password reset successfully! Please login with your new password.', 'success');
                    hideForgotPasswordModal();
                } else {
                    showNotification(result.error || 'Failed to reset password', 'error');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showNotification('Connection error. Please try again.', 'error');
            } finally {
                resetBtn.disabled = false;
                resetText.style.display = 'inline';
                resetLoading.style.display = 'none';
            }
        }

        async function resendCode() {
            const email = document.getElementById('resetEmail').value;
            const resendBtn = document.getElementById('resendCodeBtn');
            const resendText = document.getElementById('resendCodeText');
            const resendLoading = document.getElementById('resendCodeLoading');

            if (!email) {
                showNotification('Email not found', 'error');
                return;
            }

            resendBtn.disabled = true;
            resendText.style.display = 'none';
            resendLoading.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_BASE}/api/v1/partners/auth/resend-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('New recovery code sent to your email', 'success');
                } else {
                    showNotification(result.error || 'Failed to resend code', 'error');
                }
            } catch (error) {
                console.error('Resend code error:', error);
                showNotification('Connection error. Please try again.', 'error');
            } finally {
                resendBtn.disabled = false;
                resendText.style.display = 'inline';
                resendLoading.style.display = 'none';
            }
        }

        // Close modal when clicking outside
        document.getElementById('registerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideRegisterForm();
            }
        });
    </script>
</body>
</html>
