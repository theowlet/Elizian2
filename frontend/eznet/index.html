<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EZNet — Powered by Hungry Diner</title>
  <meta name="description" content="Discover and book the best dining, events, movies, activities and more with EZNet." />
  <meta name="theme-color" content="#111827" />
  <link rel="icon" href="data:," />
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#111827;
      --muted:#6b7280;
      --text:#f9fafb;
      --brand:#06b6d4;
      --brand-2:#22d3ee;
      --card:#0f1620;
      --ok:#10b981;
      --warn:#f59e0b;
      --err:#ef4444;
      --stroke:rgba(255,255,255,.08);
      --shadow:0 10px 25px rgba(0,0,0,.35);
      --radius:16px;
      --radius-sm:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,#0b0f14 0%,#0b0f14 40%,#0c1219 100%);
      color:var(--text);
      font:400 15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      letter-spacing:.1px;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .app{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px 96px;
    }
    /* Header */
    .topbar{
      position:sticky;top:0;z-index:50;
      backdrop-filter:saturate(1.2) blur(8px);
      background:rgba(11,15,20,.75);
      border-bottom:1px solid var(--stroke);
    }
    .topbar-wrap{
      max-width:1100px;margin:0 auto;padding:12px 16px;
      display:flex;align-items:center;gap:12px;
    }
    .logo{
      display:flex;align-items:center;gap:10px;font-weight:700;
      letter-spacing:.4px;
    }
    .logo-badge{
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;
      overflow:hidden;
    }
    .logo-badge img{
      width:100%;height:100%;object-fit:contain;
    }
    .brand-sub{
      color:var(--muted);font-size:12px;font-weight:600;margin-left:4px
    }
    .grow{flex:1}
    .search{
      flex:1;display:flex;align-items:center;gap:10px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--stroke);border-radius:999px;padding:8px 12px;
    }
    .search input{
      background:transparent;border:0;outline:0;color:var(--text);flex:1;
    }
    .pill{
      border-radius:999px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);padding:8px 12px;
    }
    .ghost{background:transparent;border:1px solid var(--stroke);color:var(--text)}
    .cta{background:linear-gradient(90deg,var(--brand),var(--brand-2));border:0;color:#002b33}
    .icon{width:20px;height:20px;opacity:.9}
    /* Hero */
    .hero{
      margin:18px 0 10px;
      background:
        radial-gradient(1200px 500px at 50% -300px, rgba(34,211,238,.12), transparent 60%),
        linear-gradient(180deg, rgba(34,211,238,.06), transparent 60%);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .hero-grid{
      display:grid;grid-template-columns:1.2fr .8fr;gap:14px;
    }
    .banner{
      position:relative;overflow:hidden;border-radius:var(--radius);
      background:linear-gradient(110deg,#0e1621,#0e1722 45%,#0a1017);
      min-height:160px;border:1px solid var(--stroke);
    }
    .banner-inner{padding:18px}
    .banner h1{margin:0 0 6px;font-size:22px}
    .banner p{margin:0;color:var(--muted)}
    .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);
      border:1px solid var(--stroke);font-size:12px;color:#d1d5db
    }
    .stat{
      display:grid;gap:6px;border-radius:var(--radius);
      border:1px solid var(--stroke);padding:14px;background:rgba(255,255,255,.03)
    }
    .stat b{font-size:20px}
    /* Tabs */
    .tabs{
      display:flex;gap:8px;overflow:auto;padding:10px 2px 0;margin-bottom:8px
    }
    .tab{
      white-space:nowrap;padding:10px 12px;border-radius:999px;
      border:1px solid var(--stroke);background:rgba(255,255,255,.04);
      color:#dbeafe;font-weight:600;font-size:13px;cursor:pointer;
      transition:.2s transform;
    }
    .tab.active{background:linear-gradient(90deg,rgba(34,211,238,.12),rgba(6,182,212,.08));border-color:rgba(34,211,238,.35)}
    .tab:hover{transform:translateY(-1px)}
    /* Filters */
    .toolbar{
      display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 4px
    }
    .seg{display:flex;border:1px solid var(--stroke);border-radius:999px;overflow:hidden}
    .seg button{
      padding:8px 12px;border:0;background:transparent;color:#d1d5db
    }
    .seg button.active{background:rgba(255,255,255,.06)}
    /* Grid */
    .grid{
      display:grid;gap:12px;
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    @media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    .card{
      border:1px solid var(--stroke);border-radius:14px;background:var(--card);
      overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-height:240px;
      transition:.25s transform,.25s box-shadow
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .card-img{
      height:140px;background:linear-gradient(135deg,#0d1722,#0c1420);
      display:grid;place-items:center;border-bottom:1px solid var(--stroke)
    }
    .card-body{padding:12px;display:grid;gap:6px}
    .title{font-weight:700}
    .meta{color:var(--muted);font-size:13px}
    .tag{font-size:12px;color:#a7f3d0;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);padding:4px 8px;border-radius:999px}
    .discount{color:#fca5a5;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3)}
    .cta-inline{
      margin-top:6px;display:flex;gap:8px
    }
    .btn{padding:8px 10px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:#e5e7eb}
    .btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));border:0;color:#002b33}
    .btn.ghost{background:transparent}
    /* Empty / error / skeleton */
    .state{
      border:1px dashed var(--stroke);border-radius:14px;padding:18px;text-align:center;color:var(--muted)
    }
    .skeleton{
      animation:shine 1.1s linear infinite;background:
        linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
      background-size:200% 100%;
      border-radius:10px;min-height:120px;border:1px solid var(--stroke)
    }
    @keyframes shine{to{background-position:-200% 0}}
    /* Footer */
    .foot{
      margin:22px 0 64px;color:var(--muted);font-size:13px;text-align:center
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Top navigation">
    <div class="topbar-wrap">
      <div class="logo" aria-label="EZNet logo">
        <div class="logo-badge">
          <img src="../public/mockups/images/z.png" alt="EZNet Logo">
        </div>
        <div>
          EZNet <span class="brand-sub">powered by Hungry Diner</span>
        </div>
      </div>
      <div class="grow"></div>
      <div class="search" role="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.2-4.2m1.7-4.8a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" placeholder="Search Partners" aria-label="Search" />
        <button id="clear" class="pill ghost" title="Clear" aria-label="Clear search">Clear</button>
      </div>
      <a href="../wellness.html" class="pill" style="background: rgba(255,255,255,.04); color: var(--text);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" style="width: 16px; height: 16px;">
          <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke="currentColor" stroke-width="2"/>
        </svg>
        Wellness
      </a>
      <button class="pill cta" id="loginBtn" title="Login">Login</button>
    </div>
  </header>

  <main class="app" id="app">
    <section class="hero" aria-label="Highlights">
      <div class="hero-grid">
        <div class="banner">
          <div class="banner-inner">
            <h1>Discover great Experiences near you</h1>
            <p>Handpicked events with exclusive partner benefits.</p>
            <div class="chips" id="quickFilters">
              <span class="chip" data-q="fine">Fine Dining</span>
              <span class="chip" data-q="popular">Popular</span>
              <span class="chip" data-q="near">Near Me</span>
              <span class="chip" data-q="new">Newly Added</span>
            </div>
          </div>
        </div>
        <div class="stat">
          <div class="meta">Live categories</div>
          <b id="catCount">—</b>
          <div class="meta">Dining is live • Others coming soon</div>
        </div>
      </div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Categories">
      <!-- Tabs inserted by JS -->
    </nav>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="Sort">
        <button class="active" data-sort="popular">Popular</button>
        <button data-sort="nearby">Nearby</button>
        <button data-sort="az">A–Z</button>
      </div>
      <div class="seg" role="group" aria-label="Filter">
        <button id="filterBtn">Filters</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <section id="gridWrap">
      <div class="grid" id="grid">
        <!-- Cards inserted by JS -->
      </div>
      <div id="state" class="state" style="display:none"></div>
    </section>

    <p class="foot">© <span id="year"></span> EZNet • v1.0 • <a href="/">elizian</a></p>
  </main>

  <script>
    // ---------- Config ----------
    const API_BASE = (window.EZNET_API_BASE || '').trim() || 'http://localhost:5001';
    const ENDPOINTS = {
      categories: API_BASE + '/api/v1/categories',
      partners: (slug) => API_BASE + '/api/v1/partners?category=' + encodeURIComponent(slug || '')
    };

    // Phase-1: what is truly live?
    const LIVE_SLUGS = new Set(['dining']);

    // Fallback top bar categories (shown if API not ready)
    const FALLBACK_TABS = [
      { slug:'dining',           label:'Dining' },
      { slug:'events',           label:'Events' },
      { slug:'movies',           label:'Movies' },
      { slug:'activities',       label:'Activities' },
      { slug:'health-wellness',  label:'Health & Wellness' },
      { slug:'spa-salon',        label:'Spa & Salon' },
      { slug:'travel',           label:'Travel' },
      { slug:'others',           label:'Others' }
    ];

    // ---------- State ----------
    let categories = [];
    let activeSlug = 'dining';
    let cache = new Map(); // cache by slug

    // ---------- Elements ----------
    const tabsEl = document.getElementById('tabs');
    const gridEl = document.getElementById('grid');
    const stateEl = document.getElementById('state');
    const catCountEl = document.getElementById('catCount');
    const yearEl = document.getElementById('year');
    const searchInput = document.getElementById('q');
    const clearBtn = document.getElementById('clear');

    yearEl.textContent = new Date().getFullYear();

    // ---------- Utilities ----------
    function h(tag, attrs={}, children=[]){
      const el = document.createElement(tag);
      for (const [k,v] of Object.entries(attrs)){
        if (k === 'class') el.className = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v !== null && v !== undefined) el.setAttribute(k, v);
      }
      for (const c of (Array.isArray(children)? children : [children])){
        el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return el;
    }

    function showState(msg, type='info'){
      stateEl.style.display = 'block';
      stateEl.style.borderStyle = (type==='error' ? 'solid' : 'dashed');
      stateEl.style.color = (type==='error' ? '#fecaca' : 'var(--muted)');
      stateEl.textContent = msg;
    }
    function hideState(){ stateEl.style.display = 'none'; }

    function showSkeleton(count=8){
      gridEl.innerHTML = '';
      hideState();
      for(let i=0;i<count;i++){
        const sk = h('div',{class:'card'},[
          h('div',{class:'card-img skeleton'}),
          h('div',{class:'card-body'},[
            h('div',{class:'skeleton',style:'height:14px;width:70%'}),
            h('div',{class:'skeleton',style:'height:12px;width:40%;margin-top:8px'})
          ])
        ]);
        gridEl.appendChild(sk);
      }
    }

    function priceOrPercent(pct){
      if (pct == null) return '';
      try{
        const n = Number(pct);
        if (Number.isFinite(n) && n>0) return n + '% off';
      }catch{}
      return '';
    }

    function cityFromAddress(addr){
      if (!addr) return '';
      const parts = String(addr).split(',').map(s => s.trim());
      return parts[parts.length-1] || '';
    }

    function card(partner){
      const city = cityFromAddress(partner.address);
      const tagText = priceOrPercent(partner.discount_percentage);
      return h('article',{class:'card', role:'article'},[
        h('div',{class:'card-img'},[
          // Placeholder SVG / initial
          h('div',{style:'font-weight:800;font-size:34px;opacity:.12'}, partner.name?.[0] || 'R')
        ]),
        h('div',{class:'card-body'},[
          h('div',{class:'title'}, partner.name || 'Partner'),
          h('div',{class:'meta'}, [
            document.createTextNode(city ? city : (partner.address || '')),
          ]),
          h('div',{class:'cta-inline'},[
            tagText ? h('span',{class:'tag discount'}, tagText) : h('span',{class:'tag'}, 'Partner'),
            h('button',{class:'btn primary', onclick:()=>alert('Deep link / details soon')},'View')
          ])
        ])
      ]);
    }

    function comingSoon(slug){
      gridEl.innerHTML = '';
      showState('"' + labelFor(slug) + '" is coming soon. Explore Dining meanwhile ✨');
    }

    function labelFor(slug){
      return (categories.find(c=>c.slug===slug)?.name) ||
             (FALLBACK_TABS.find(c=>c.slug===slug)?.label) || slug;
    }

    function applySearchFilter(rows){
      const q = (searchInput.value || '').trim().toLowerCase();
      if (!q) return rows;
      return rows.filter(r =>
        (r.name||'').toLowerCase().includes(q) ||
        (r.address||'').toLowerCase().includes(q)
      );
    }

    // ---------- Fetchers ----------
    async function fetchCategories(){
      try{
        const r = await fetch(ENDPOINTS.categories, { credentials:'omit' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const json = await r.json();
        if (!json.success) throw new Error(json.error || 'Categories error');
        const rows = Array.isArray(json.data) ? json.data : [];
        return rows;
      }catch(err){
        console.warn('[categories] falling back:', err);
        return FALLBACK_TABS.map(x=>({ id:x.slug, name:x.label, slug:x.slug, is_active:true, display_order:0 }));
      }
    }

    async function fetchPartners(slug){
      const url = ENDPOINTS.partners(slug);
      const r = await fetch(url, { credentials:'omit' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const json = await r.json();
      if (!json.success) throw new Error(json.error || 'Partners error');
      const rows = Array.isArray(json.data) ? json.data : [];
      return rows;
    }

    // ---------- Renderers ----------
    async function renderTabs(){
      tabsEl.innerHTML = '';
      categories.forEach(cat=>{
        const tab = h('button',{
          class:'tab' + (cat.slug===activeSlug?' active':''),
          role:'tab',
          'aria-selected': String(cat.slug===activeSlug),
          onclick:()=>activate(cat.slug)
        }, cat.name);
        tabsEl.appendChild(tab);
      });
      catCountEl.textContent = String(categories.length);
    }

    async function renderGridFor(slug){
      if (!LIVE_SLUGS.has(slug)){
        comingSoon(slug);
        return;
      }

      showSkeleton();
      try{
        const rows = cache.get(slug) || await fetchPartners(slug);
        cache.set(slug, rows);

        const filtered = applySearchFilter(rows);
        gridEl.innerHTML = '';

        if (filtered.length === 0){
          showState('No results. Try clearing search or changing filters.');
          return;
        }
        hideState();
        filtered.forEach(r=>gridEl.appendChild(card(r)));
      }catch(err){
        gridEl.innerHTML = '';
        showState('Could not load ' + labelFor(slug) + '. ' + err.message, 'error');
        const retry = h('button',{class:'btn', onclick:()=>renderGridFor(slug)},'Retry');
        stateEl.appendChild(h('div',{style:'margin-top:10px'}, retry));
      }
    }

    // ---------- Interaction ----------
    async function activate(slug){
      if (slug === activeSlug) return;
      activeSlug = slug;

      // update tab UI
      [...tabsEl.children].forEach(btn=>{
        btn.classList.toggle('active', btn.textContent === labelFor(slug));
      });

      // update search placeholder
      searchInput.placeholder = slug==='dining' ? 'Search Partners' : `Search ${labelFor(slug)} (soon)`;

      await renderGridFor(slug);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // Search handlers
    searchInput.addEventListener('input', ()=>{
      if (!LIVE_SLUGS.has(activeSlug)) return;
      const rows = cache.get(activeSlug) || [];
      const filtered = applySearchFilter(rows);
      gridEl.innerHTML = '';
      if (filtered.length === 0){
        showState('No matches for "' + (searchInput.value||'') + '".');
        return;
      }
      hideState();
      filtered.forEach(r=>gridEl.appendChild(card(r)));
    });
    clearBtn.addEventListener('click', ()=>{
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
      searchInput.focus();
    });

    // Quick chips
    document.getElementById('quickFilters').addEventListener('click', (e)=>{
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const q = chip.getAttribute('data-q');
      searchInput.value = q;
      searchInput.dispatchEvent(new Event('input'));
    });

    // ---------- Boot ----------
    (async function init(){
      categories = await fetchCategories();

      // Ensure our required tabs exist & in intended order (Dining first)
      const wanted = new Map(FALLBACK_TABS.map(x=>[x.slug,x.label]));
      const normalized = [];
      const got = new Set();
      // 1) push in FALLBACK order if API contains them
      for (const f of FALLBACK_TABS){
        const found = categories.find(c=>c.slug===f.slug);
        if (found){ normalized.push(found); got.add(f.slug); }
        else { normalized.push({ id:f.slug, name:f.label, slug:f.slug, is_active:(f.slug==='dining') }); }
      }
      categories = normalized;
      activeSlug = 'dining';

      await renderTabs();
      await renderGridFor(activeSlug);
    })();
  </script>
</body>
</html>
